<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics in Grades 7 and 8</title> 
<meta name="description" content="A self-paced professional development guide to the physics outcomes in Manitoba's renewed Grade 7 and 8 science curriculum, and how they lead to Science 9, Science 19, Physics 30S and Physics 40S.">
<!-- Fonts: Poppins for headings and lavels, Source Serif 4 for reading text -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel=""preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel=""stylesheet">
<style>
/* --------------------------------Colours, fonts, and sizes--------------------------------------------------
Change a colour here and it changes everywhere it is used. 
Same palette as our Physics 40S slides: graph-paper beige,
charcoal ink, yellow highlights. */
:root{
    --paper: #E3DDD3;
    --grid: #D2CBBF;
    --sheet: #FAF8F4;
    --sheet-2: #F1ECE4; 
    --ink: #292B27;
    --ink-soft: #55574F; 
    --rule: #C9C1B4; 
    --yellow:#F2C94C;                   /*used AI to find specific colour palette */
    --yellow-soft:#FBEDBF;
    --blue:#2F55B8;
    --blue-soft:#DCE4F7;
    --red:#A8382C;
    --red-soft:#F5DEDA;
    --green:#2F7D5B;
    --green-soft:#D9EDE3;
    --mid: #C77A1E;                     /* middle years on the path */
    --sr: #2F55B8;                      /* Science 9-10 */
    --spec: #292B27;                    /* Physics 40S */
    --head: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; 
    --body: "Source Serif 4", Georgia, "Times New Roman", serif; 
    --radius-lg: 18px;
    --radius-sm: 8px; 
}
/* ---------------------------------- base page ----------------------------------------------- */
*{box-sizing: border-box} 
html{scroll-behavior: smooth; scroll-padding-top: 20px} 

body{
    margin: 0; color: var(--ink); font-family:var(--body); font-size: 18px; line-height: 1.6; 
    background-image:
        linear-gradient(var(--grid) 1.5px, transparent 1.5px), 
        linear-gradient(90deg, var(--gride) 1.5px, transparent 1.5px);
    background-size:44px 44px;
}
a{color: var(--blue); text-underline-offset: 3px}
a:hover{text-decoration-thickness: 2px}
:focus-visible{outline: 3px solid var(--blue); outline-offset:3px; border-radius:4px}
h1,h2,h3,h4{font-family:var(--head); line-height:1.2; margin:0; color:var(--ink)}
h2{font-size:clamp(28px,3.4vw,38px); font-weight:700; letter-spacing:-.01em}
h3{font-size:22px; font-weight:600; margin-top:40px; margin-bottom:12px}
h4{font-size:18px; font-weight:600}
p{margin:0 0 14px}
/* hidden link that keyboard users can use to jump past the menu */
.skip{position:absolute; left:-999px;top:8px; background:var(--ink); color:#fff; padding:8px 14px; border-radius:6px; z-index:10}
.skip:focus{left:12px}

/* --------------------------------- layout ---------------------------------------------------
          Two columns: the module menu (250px) */ 
.shell{display:grid; grid-template-columns:250px minmax(0,1fr); gap:40px; max-width:1240px; margin:0 auto; padding:0 28px}
/* the menu stays in place while the page scrolls */
nav.rail{position:sticky; top:0; height:100vh; padding:28px 0; overflow:auto}
.rail-title{font-family:var(--head); font-weight:700; font-size:17px; line-height:1.25; margin-bottom:6px}
.rail-sub{font-family:var(--head); font-size:13px; color:var(--ink-soft); margin-bottom:22px}
.rail ol{list-style:none; margin:0; padding:0}
.rail li a{display:grid; grid-template-columns:26px 1fr; gap:8px; align-items:start; padding:8px 10px; border-radius:10px; text-decoration:none; color:var(--ink); font-family:var(--head); font-size:14.5px; font-weight:500; line-height:1.3}
.rail li a:hover{background:var(--sheet)}
/* "current" = the module on screen now; "done" = marked complete */
.rail li a.current{background:var(--ink); color:#fff}
.rail .dot{width:22px; height:22px; border-radius:50%; border:2px solid currentColor; display:grid; place-items:center; font-size:11px; font-weight:700; margin-top:-1px}
.rail li a.done .dot{background:var(--green); border-color:var(--green); color:#fff}
.rail .mins{display:block; font-size:12px; font-weight:500; opacity:.7; margin-top:2px}
/* progress bar under the menu */
.progress{margin-top:22px; font-family:var(--head); font-size:13px; color:var(--ink-soft)}
.bar{height:8px; background:var(--sheet); border-radius:99px; overflow:hidden; margin-top:6px; border:1px solid var(--rule)}
.bar span{display:block; height:100%; width:0; background:var(--green); transition:width .3s}
main{padding:28px 0 80px; min-width:0}

/* ------------------------------------- sheet ----------------------------------
   Each module sits on a white "sheet" laid over the graph paper. */
.sheet{background:var(--sheet); border-radius:var(--radius-lg); padding:44px 52px; margin-bottom:36px; box-shadow:0 1px 0 var(--rule)}
.prose{max-width:720px}
.lede{font-size:20px; line-height:1.55; color:var(--ink)}
.mod-head{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:baseline; justify-content:space-between; margin-bottom:18px}
.mod-meta{font-family:var(--head); font-size:14px; color:var(--ink-soft)}
/* the "Mark module done" buttons */
.mark{font-family:var(--head); font-size:14px; font-weight:600; border:2px solid var(--ink); background:transparent; color:var(--ink); border-radius:99px; padding:7px 16px; cursor:pointer}
.mark:hover{background:var(--ink); color:#fff}
.mark[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#fff}
.mod-foot{margin-top:34px; padding-top:20px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center}
.mod-foot .mark{font-size:15px; padding:10px 20px}

/* ---------- hero (the Start here section) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; align-items:center; padding:52px 52px 44px}
.hero h1{font-size:clamp(40px,5.4vw,66px); font-weight:700; letter-spacing:-.025em; line-height:1.02; margin-bottom:22px}
.hero .who{font-family:var(--head); font-size:15px; color:var(--ink-soft); margin-top:20px}
/* the rising path chart: the line draws itself once, then the dots appear */
.arc svg{width:100%; height:auto; display:block}
.arc .path{stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 2.2s .3s ease-out forwards}
.arc .pt{opacity:0; animation:pop .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.arc .path{stroke-dashoffset:0}.arc .pt{opacity:1}}
/* the three "how to use this guide" tips */
.howto{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:8px}
.howto div{border-top:3px solid var(--ink); padding-top:12px; font-size:16px}
.howto strong{font-family:var(--head); font-size:15px; display:block;margin-bottom:4px}

</style>
    </head>
